<style>

@media(prefers-color-scheme:dark){:root{--bg:#2a1620;--card:#3a1f2c;--pk:#f06fa2;--pk2:#5a2a40;--tx:#fbe6ef;--mu:#d3a2b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{color:var(--pk);font-size:1.5rem;margin:6px 0 2px;text-align:center}.sub{text-align:center;color:var(--mu);font-size:.9rem;margin-bottom:18px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(232,80,138,.15);margin-bottom:12px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--pk2);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mode b{color:var(--pk)}.mode small{display:block;color:var(--mu)}
.mode.sel{border-color:var(--pk);background:var(--pk2)}
input[type=number]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--pk2);background:var(--card);margin-top:8px;font-size:1.1rem}
input:focus{outline:none;border-color:var(--pk)}
.err{color:var(--no);font-size:.88rem;margin-top:6px;min-height:1.1em}
.go{width:100%;background:var(--pk);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1rem;margin-top:6px}
.go:disabled{opacity:.4}
.bar{height:8px;background:var(--pk2);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--pk);transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu)}
.q{font-size:2.6rem;text-align:center;padding:12px 4px;line-height:1.4;font-weight:600;word-break:break-all}.q.s{font-size:1.3rem;font-weight:500}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--pk2);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.box{background:var(--pk2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.hintb{display:block;margin:8px auto 0;background:none;border:0;color:var(--pk);font-weight:600;padding:4px 8px}
.big{font-size:4rem;text-align:center;color:var(--pk);font-weight:800}.c{text-align:center}
.ghost{width:100%;background:none;border:2px solid var(--pk);color:var(--pk);border-radius:14px;padding:12px;margin-top:8px;font-weight:600}
</style></head><body><main id="app"></main>

const P=s=>s.split(" ");

const kana=[];
const add=(h,r,t)=>{kana.push([h,r,"Hiragana ("+t+"). Pasangan Katakana: "+K(h)]);kana.push([K(h),r,"Katakana ("+t+"). Pasangan Hiragana: "+h])};
[[HB,"dasar"],[HD,"dakuon: tanda ゛ mengubah bunyi"],[HP,"handakuon: tanda ゜ untuk bunyi p"]].forEach(([a,t])=>{for(let i=0;i<a.length;i+=2)add(a[i],a[i+1],t)});
const SM=["ゃ","ゅ","ょ"];
YO.forEach(y=>{const[p,r]=y.split(":"),rs=r.split(",");rs.forEach((x,i)=>add(p+SM[i],x,"youon: kana kecil ゃゅょ menyatu dengan huruf sebelumnya, dibaca satu suku kata"))});

kai:[["わたしは学生です。","Saya seorang pelajar.","N1 は N2 です = N1 adalah N2."],["これは何ですか。","Ini apa?","何 (なに) = apa; か = penanda tanya."],["トイレはどこですか。","Toilet ada di mana?","どこ = di mana."],["いくらですか。","Berapa harganya?","Ungkapan saat berbelanja."],["おはようございます。","Selamat pagi.","Sapaan sopan di pagi hari."],["ありがとうございます。","Terima kasih.","Ungkapan terima kasih sopan."],["すみません。","Permisi / maaf.","Dipakai untuk meminta maaf atau memanggil orang."],["わたしは毎日コーヒーを飲みます。","Saya minum kopi setiap hari.","を menandai objek; ～ます = bentuk sopan kata kerja."],["きのう、友達と映画を見ました。","Kemarin saya menonton film dengan teman.","と = bersama; ～ました = lampau sopan."],["あした学校へ行きません。","Besok saya tidak pergi ke sekolah.","へ = arah; ～ません = negatif sopan."],["図書館で本を読みます。","Saya membaca buku di perpustakaan.","で = tempat berlangsungnya tindakan."],["この りんごは おいしいです。","Apel ini enak.","Kata sifat-i + です."],["ここに座ってもいいですか。","Bolehkah saya duduk di sini?","～てもいいですか = bolehkah ...?"],["ここで写真をとらないでください。","Tolong jangan memotret di sini.","～ないでください = tolong jangan ..."],["ちょっと待ってください。","Tolong tunggu sebentar.","～てください = tolong ..."],["日本語がすこし話せます。","Saya bisa berbicara bahasa Jepang sedikit.","Bentuk potensial + が."],["わたしは水が飲みたいです。","Saya ingin minum air.","～たい = ingin melakukan."],["お元気ですか。","Apa kabar?","Salam menanyakan kesehatan."],["いただきます。","Selamat makan.","Diucapkan sebelum makan."],["いってきます。","Saya berangkat (dulu).","Dijawab: いってらっしゃい."],["猫は机の上にいます。","Kucing ada di atas meja.","いる untuk makhluk hidup; に = lokasi keberadaan."]]};
const JH=["Arti: hari, matahari. Onyomi (bacaan Cina): ニチ, ジツ. Kunyomi (bacaan Jepang): ひ, か. Contoh: 日本 (にほん) = Jepang; 日曜日 (にちようび) = hari Minggu.", "Arti: bulan (langit dan kalender). Onyomi: ゲツ, ガツ. Kunyomi: つき. Contoh: 月曜日 (げつようび) = hari Senin; 一月 (いちがつ) = Januari.", "Arti: api. Onyomi: カ. Kunyomi: ひ. Contoh: 火曜日 (かようび) = hari Selasa. Bentuknya seperti api yang menyala.", "Arti: air. Onyomi: スイ. Kunyomi: みず. Contoh: 水曜日 (すいようび) = hari Rabu; 水 (みず) = air.", "Arti: pohon, kayu. Onyomi: モク, ボク. Kunyomi: き. Contoh: 木曜日 (もくようび) = hari Kamis; 木 (き) = pohon. Bentuknya seperti pohon berakar dan bercabang.", "Arti: emas, logam, uang. Onyomi: キン. Kunyomi: かね. Contoh: 金曜日 (きんようび) = hari Jumat; お金 (おかね) = uang.", "Arti: tanah. Onyomi: ド, ト. Kunyomi: つち. Contoh: 土曜日 (どようび) = hari Sabtu; 土 (つち) = tanah.", "Arti: gunung. Onyomi: サン. Kunyomi: やま. Contoh: 山 (やま) = gunung; 富士山 (ふじさん) = Gunung Fuji. Bentuknya seperti tiga puncak gunung.", "Arti: sungai. Onyomi: セン. Kunyomi: かわ. Contoh: 川 (かわ) = sungai. Bentuknya seperti tiga aliran air.", "Arti: orang. Onyomi: ジン, ニン. Kunyomi: ひと. Contoh: 日本人 (にほんじん) = orang Jepang; 人 (ひと) = orang. Bentuknya seperti orang yang berdiri.", "Arti: besar. Onyomi: ダイ, タイ. Kunyomi: おお(きい). Contoh: 大学 (だいがく) = universitas; 大きい (おおきい) = besar. Bentuknya seperti orang merentangkan tangan.", "Arti: kecil. Onyomi: ショウ. Kunyomi: ちい(さい), こ. Contoh: 小さい (ちいさい) = kecil; 小学校 (しょうがっこう) = sekolah dasar. Lawan dari 大.", "Arti: tengah, dalam. Onyomi: チュウ. Kunyomi: なか. Contoh: 中 (なか) = di dalam; 日本中 (にほんじゅう) = seluruh Jepang.", "Arti: atas. Onyomi: ジョウ. Kunyomi: うえ, あ(がる). Contoh: 机の上 (つくえのうえ) = di atas meja. Lawan dari 下.", "Arti: bawah. Onyomi: カ, ゲ. Kunyomi: した, さ(がる). Contoh: 木の下 (きのした) = di bawah pohon. Lawan dari 上.", "Arti: kiri. Onyomi: サ. Kunyomi: ひだり. Contoh: 左 (ひだり) = kiri; 左へ曲がります = Belok ke kiri. Pasangan dari 右.", "Arti: kanan. Onyomi: ユウ, ウ. Kunyomi: みぎ. Contoh: 右 (みぎ) = kanan; 右手 (みぎて) = tangan kanan. Pasangan dari 左.", "Arti: belajar. Onyomi: ガク. Kunyomi: まな(ぶ). Contoh: 学生 (がくせい) = pelajar; 大学 (だいがく) = universitas; 学校 (がっこう) = sekolah.", "Arti: hidup, lahir, mentah. Onyomi: セイ, ショウ. Kunyomi: い(きる), う(まれる), なま. Contoh: 学生 (がくせい) = pelajar; 先生 (せんせい) = guru.", "Arti: lebih dulu, sebelumnya. Onyomi: セン. Kunyomi: さき. Contoh: 先生 (せんせい) = guru (orang yang lahir lebih dulu); 先月 (せんげつ) = bulan lalu.", "Arti: buku, asal-usul. Onyomi: ホン. Kunyomi: もと. Contoh: 本 (ほん) = buku; 日本 (にほん) = Jepang (asal matahari); 三本 (さんぼん) = tiga batang.", "Arti: makan. Onyomi: ショク. Kunyomi: た(べる). Contoh: 食べる (たべる) = makan; 食事 (しょくじ) = makan/hidangan.", "Arti: minum. Onyomi: イン. Kunyomi: の(む). Contoh: 飲む (のむ) = minum; 飲み物 (のみもの) = minuman.", "Arti: melihat. Onyomi: ケン. Kunyomi: み(る). Contoh: 見る (みる) = melihat; 見学 (けんがく) = kunjungan belajar.", "Arti: pergi. Onyomi: コウ, ギョウ. Kunyomi: い(く), おこな(う). Contoh: 行く (いく) = pergi; 銀行 (ぎんこう) = bank.", "Arti: datang. Onyomi: ライ. Kunyomi: く(る). Contoh: 来る (くる) = datang; 来月 (らいげつ) = bulan depan; 来年 (らいねん) = tahun depan.", "Arti: tahun, usia. Onyomi: ネン. Kunyomi: とし. Contoh: 今年 (ことし) = tahun ini; 来年 (らいねん) = tahun depan; 二十年 (にじゅうねん) = dua puluh tahun.", "Arti: waktu, jam. Onyomi: ジ. Kunyomi: とき. Contoh: 三時 (さんじ) = jam tiga; 時間 (じかん) = waktu; 時々 (ときどき) = kadang-kadang.", "Arti: ayah. Onyomi: フ. Kunyomi: ちち. Contoh: 父 (ちち) = ayah saya (sendiri); 父親 (ちちおや) = ayah. Untuk ayah orang lain dipakai お父さん.", "Arti: ibu. Onyomi: ボ. Kunyomi: はは. Contoh: 母 (はは) = ibu saya (sendiri); 母親 (ははおや) = ibu. Untuk ibu orang lain dipakai お母さん."];BANK.koto=[["たべる", "makan", "Kata kerja. Sopan: たべます. Contoh: パンをたべます (makan roti)."], ["のむ", "minum", "Kata kerja. Sopan: のみます. Contoh: みずをのみます (minum air)."], ["いく", "pergi", "Kata kerja. Sopan: いきます. Contoh: がっこうへいきます (pergi ke sekolah)."], ["くる", "datang", "Kata kerja. Sopan: きます. Lawan katanya いく."], ["みる", "melihat / menonton", "Kata kerja. Sopan: みます. Contoh: テレビをみます (menonton TV)."], ["きく", "mendengar / bertanya", "Kata kerja. Sopan: ききます. Contoh: おんがくをききます (mendengar musik)."], [ const A=document.getElementById("app");let S={mode:null,n:10};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function menu(e){A.innerHTML=`<h1>🌸 N5 Japanese Master</h1><div class="sub">Latihan mandiri persiapan JLPT N5</div>
<div class="card"><b>1. Pilih mode</b><div style="margin-top:10px">${MODES.map(m=>`<button class="mode ${S.mode==m[0]?"sel":""}" onclick="S.mode='${m[0]}';menu()"><b>${m[1]}</b><small>${m[2]}</small></button>`).join("")}</div>
<b>2. Jumlah soal (1–100)</b><input id="n" type="number" inputmode="numeric" min="1" max="100" value="${S.n}" oninput="S.n=this.value;document.getElementById('e').textContent=''"><div class="err" id="e">${e||""}</div></div>
<button class="go" ${S.mode?"":"disabled"} onclick="start()">Mulai Kuis</button>`}
function start(){const n=Number(S.n);if(!Number.isInteger(n)||S.n===""||n<1||n>100){menu("Jumlah soal harus berupa angka bulat antara 1 dan 100.");return}
const b=BANK[S.mode],m=Math.min(n,b.length);S.pool=b;S.qs=sh(b).slice(0,m);S.i=0;S.ok=0;S.note=m<n?`Bank soal mode ini berisi ${b.length} soal, jadi sesi memakai ${m} soal.`:"";show()}
function show(){const q=S.qs[S.i],ot=[...new Set(sh(S.pool.filter(x=>x[1]!==q[1]).map(x=>x[1])))].slice(0,3),o=sh([q[1],...ot]);S.done=false;
A.innerHTML=`<div class="top"><span>Soal ${S.i+1}/${S.qs.length}</span><span>Benar: ${S.ok}</span></div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>

${o.map(t=>`<button class="opt" onclick="ans(this)">${t}</button>`).join("")}<div id="fb"></div>`}
